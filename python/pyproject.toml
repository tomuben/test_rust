[tool.poetry]
name = "mechanics"
version = "0.1.0"
authors = ["CK"]
# description = "mechanipoetry-experiments"
packages = [{ include = "mechanics" }, ]

[tool.poetry.dependencies]
python = ">=3.9.0,<4.0"
nbclient = "^0.9.0"
mypy = "^1.18.1"

[build-system]
requires = ["poetry_core>=1.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry.dev-dependencies]
pytest = "^7.1.1"
pytest-mock = "^3.7.0"

[tool.pytest.ini_options]
minversion = "6.0"

testpaths = [
    "test"
]
